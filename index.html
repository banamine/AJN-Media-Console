<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AJN Liberty Play v3.0 — Ultra-Lean IPTV Console</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#05080f" />
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/banamine/AJN-Resource-Hub/main/ajn_logo.png">
    <style>
      /* P0 fix: html/body/#root previously used min-height: 100vh with no overflow
         constraint, so nothing stopped the document from growing taller than the
         viewport whenever any deeply-nested content overflowed its box (a large
         playlist, a long EPG list, etc) - the whole page would balloon and the
         browser's own scrollbar would take over instead of the intended internal
         panel scrolling. Locking these to the viewport height with overflow hidden
         makes the app-shell truly viewport-locked: only elements that explicitly
         opt into overflow-y-auto (the playlist/EPG panels) can ever scroll. */
      body, html { margin: 0; padding: 0; background: #000; color: #fff; width: 100%; height: 100%; overflow: hidden; }
      #root { width: 100%; height: 100%; overflow: hidden; }
      #unified-player-app { height: 100vh; display: flex; flex-direction: column; background: #000000; color: #e2e8f0; font-family: system-ui, sans-serif; overflow: hidden; user-select: none; }
      .video-container { width: 100%; height: 100%; background: #000; }
    </style>
  </head>
  <body style="background-color: #05080f; color: #ffffff; height: 100%; overflow: hidden;">
    <div id="root">
      <style>
        .ajn-app-shell { display: flex; flex-direction: column; height: 100vh; background: #05080f; color: #fff; font-family: system-ui, sans-serif; align-items: center; justify-content: center; }
        .ajn-app-shell .loader { width: 48px; height: 48px; border: 4px solid rgba(255,107,53,0.2); border-left-color: #ff6b35; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 24px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      </style>
      <div class="ajn-app-shell">
        <div class="loader"></div>
        <div style="font-weight: 600; letter-spacing: 0.1em; color: #707070; text-transform: uppercase; font-size: 14px;">Initializing AJN System</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
